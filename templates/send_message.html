<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Us a Message | LookFor</title>
    <link rel="stylesheet" href="/static/landing.css?v=6.4">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
body{
    font-family: Arial, sans-serif;
    background:#f5f7fa;
    margin:0;
}

.container{
    max-width:800px;
    margin:80px auto;
    background:white;
    padding:40px;
    border-radius:16px;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
}

h1{
    color:#0d6efd;
}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input, textarea{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:8px;
    box-sizing:border-box;
}

textarea{
    min-height:150px;
    resize:vertical;
}

button{
    background:#0d6efd;
    color:white;
    border:none;
    padding:12px 24px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#0b5ed7;
}
</style>
    <link rel="stylesheet" href="/static/support-pages.css?v=1.2">
</head>
<body class="landing-subpage support-page support-message-page">
    <header class="navbar">
        <div><span class="logow">Look<span>For</span></span></div>
        <nav aria-label="Main navigation">
            <ul>
                <li><a href="/" class="active">Home</a></li>
                <li><a href="/explore">Features</a></li>
                <li><a href="/about">About</a></li>
            </ul>
        </nav>
        <a href="/login" class="btn-login">Login</a>
    </header>

    <div class="container">
    <h1>📩 Send Us a Message</h1>

    <p>
        Have questions, suggestions, or concerns? Contact the LookFor team and we'll get back to you.
    </p>

    <form>
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" required>
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" required>
        </div>

        <div class="form-group">
            <label>Subject</label>
            <input type="text" required>
        </div>

        <div class="form-group">
            <label>Message</label>
            <textarea required></textarea>
        </div>

        <button type="submit">Send Message</button>
    </form>
</div>
    {% include "_public_footer.html" %}
    <script src="/static/public-subpage-nav.js?v=1.0"></script>
</body>
</html>
