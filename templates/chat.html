<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Let's Chat | LookFor</title>

<link rel="stylesheet" href="/static/landing.css?v=6.4">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f9;
}

html{
    overflow-y:scroll;
}

body.chat-page{
    height:auto;
    overflow-x:hidden;
    overflow-y:auto;
}

.chat-container{
    width:min(900px, calc(100% - 32px));
    max-width:900px;
    margin:50px auto;
    background:white;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
}

.chat-header{
    background:#0d6efd;
    color:white;
    padding:20px;
}

.chat-header h2{
    margin:0 0 6px;
    color:white;
    font-size:2rem;
    line-height:1.2;
}

.chat-header p{
    margin:0;
    color:white;
    font-size:1rem;
}

.chat-body{
    height:clamp(450px, 70vh, 720px);
    padding:20px;
    overflow-y:auto;
}

.message{
    margin-bottom:15px;
}

.bot{
    background:#f1f3f5;
    padding:10px 15px;
    border-radius:12px;
    width:fit-content;
}

.user{
    background:#0d6efd;
    color:white;
    padding:10px 15px;
    border-radius:12px;
    width:fit-content;
    margin-left:auto;
}

.chat-input{
    display:flex;
    border-top:1px solid #ddd;
}

.chat-input input{
    flex:1;
    border:none;
    padding:15px;
    outline:none;
}

.chat-input button{
    border:none;
    background:#0d6efd;
    color:white;
    padding:0 25px;
    cursor:pointer;
}

@media (max-width:768px){
    .chat-container{
        margin:24px auto;
    }

    .chat-header h2{
        font-size:1.6rem;
    }
}
</style>
<link rel="stylesheet" href="/static/support-pages.css?v=1.2">
</head>
<body class="landing-subpage support-page chat-page">

<header class="navbar">
    <div><span class="logow">Look<span>For</span></span></div>
    <nav aria-label="Main navigation">
        <ul>
            <li><a href="/" class="active">Home</a></li>
            <li><a href="/explore">Features</a></li>
            <li><a href="/about">About</a></li>
        </ul>
    </nav>
    <a href="/login" class="btn-login">Login</a>
</header>

<div class="chat-container">

    <div class="chat-header">
        <h2>💬 Let's Chat</h2>
        <p>Chat with the LookFor Support Team.</p>
    </div>

    <div class="chat-body">
        <div class="message">
            <div class="bot">
                Hello! How can we help you today?
            </div>
        </div>
    </div>

    <div class="chat-input">
        <input type="text" placeholder="Type your message...">
        <button>Send</button>
    </div>

</div>

{% include "_public_footer.html" %}
<script src="/static/public-subpage-nav.js?v=1.0"></script>
</body>
</html>
